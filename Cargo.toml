[package]
name = "rath-rs"
version = "0.2.10"
edition = "2024"
description = "Provider-agnostic Rust clients and wire types for agentic AI APIs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vivsh/rath-rs"
keywords = ["llm", "agent", "ai", "multimodal", "openai"]
categories = ["api-bindings", "asynchronous"]

[lib]
name = "rath"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
ed25519-dalek = "2"
gemini-rust = "2.1.0"
http = "1"
reqwest = { version = "0.13.2", features = ["json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"
thiserror = "2"
tiktoken-rs = "0.12"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

[profile.dev]
incremental = false
